# CHIPS is unavailable in stagsbox. When enabled, the mock posts a successful
# processed response to chs-kafka-api-java instead of calling CHIPS.
chips.mock.enabled=${CHIPS_MOCK_ENABLED:true}
chips.mock.kafka.api.url=${CHIPS_MOCK_KAFKA_API_URL:http://api.chs.local:4001/private/strike-off-partner-objections-processed}
chips.mock.kafka.api.key=${CHIPS_MOCK_KAFKA_API_KEY}
