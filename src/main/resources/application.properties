spring.application.name=strike-off-partner-objections-processor

management.endpoint.health.show-details=${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:never}
management.endpoint.health.probes.enabled=${MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED:true}
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health}
management.endpoints.web.base-path=${MANAGEMENT_ENDPOINTS_WEB_BASE_PATH:/strike-off-partner-objections-processor}
management.endpoints.web.path-mapping.health=${MANAGEMENT_ENDPOINTS_WEB_PATH_MAPPING_HEALTH:healthcheck}
logging.level.org.springframework.kafka=DEBUG
logging.level.org.apache.kafka=INFO
logging.level.org.springframework.kafka.config=DEBUG

spring.kafka.bootstrap-servers=${BOOTSTRAP_SERVER_URL}
chips.rest-interface.base-url=${CHIPS_REST_INTERFACE_BASE_URL:http://chips:7001/chips-restService/rest}
chips.rest-interface.api-key=${CHIPS_REST_API_KEY}

kafka.topic.strikeoff.objections=${KAFKA_TOPIC_STRIKEOFF_OBJECTIONS}
kafka.strikeoff.objections.group-id=${KAFKA_STRIKEOFF_OBJECTIONS_GROUP_ID}

kafka.topic.strikeoff.processed-objections=${KAFKA_TOPIC_STRIKEOFF_PROCESSED_OBJECTIONS}
kafka.strikeoff.processed-objections.group-id=${KAFKA_STRIKEOFF_PROCESSED_OBJECTIONS_GROUP_ID}

kafka.session.timeout=${SESSION_TIMEOUT_MS_CONFIG}
kafka.max.poll.interval=${MAX_POLL_INTERVAL_MS_CONFIG}
kafka.heartbeat.interval=${HEARTBEAT_INTERVAL_MS_CONFIG}
kafka.max.poll.records=${MAX_POLL_RECORDS_CONFIG}

kafka.max-attempts=${MAX_ATTEMPTS}
kafka.backoff-delay=${BACKOFF_DELAY}
kafka.concurrency=${CONCURRENT_LISTENER_INSTANCES}