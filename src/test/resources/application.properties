management.endpoints.web.base-path=/strike-off-partner-objections-processor
management.endpoints.web.path-mapping.health=healthcheck
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.endpoints.web.exposure.include=health

spring.kafka.bootstrap-servers=${BOOTSTRAP_SERVER_URL:localhost:9092}

kafka.topic.strikeoff.objections=${KAFKA_TOPIC_STRIKEOFF_OBJECTIONS:strike-off-partner-objections-incoming}
kafka.strikeoff.objections.group-id=${KAFKA_STRIKEOFF_OBJECTIONS_GROUP_ID:strike-off-partner-objections-incoming-consumer}

kafka.max-attempts=${MAX_ATTEMPTS:5}
kafka.backoff-delay=${BACKOFF_DELAY:1000}
kafka.backoff-multiplier=${BACKOFF_MULTIPLIER:2.0}
kafka.backoff-max-delay=${BACKOFF_MAX_DELAY:16000}
logging.level.org.springframework.kafka.listener=DEBUG
logging.level.org.springframework.kafka.core=DEBUG
logging.level.org.apache.kafka.clients.consumer=DEBUG
logging.level.org.apache.kafka.common.network=INFO