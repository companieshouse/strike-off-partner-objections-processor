management.endpoints.web.base-path=/strike-off-partner-objections-processor
management.endpoints.web.path-mapping.health=healthcheck
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.endpoints.web.exposure.include=health
spring.kafka.bootstrap-servers=${BOOTSTRAP_SERVER_URL:localhost:9092}
kafka.bootstrap-servers=${BOOTSTRAP_SERVER_URL:localhost:9092}
chips.rest-interface.base-url=${CHIPS_REST_INTERFACE_BASE_URL:http://chips:7001/chips-restService/rest}
kafka.topic.strikeoff.objections=${KAFKA_TOPIC_STRIKEOFF_OBJECTIONS:strike-off-partner-objections-incoming}
kafka.strikeoff.objections.group-id=${KAFKA_STRIKEOFF_OBJECTIONS_GROUP_ID:strike-off-partner-objections-incoming-consumer}
kafka.consumer.group-id=${KAFKA_STRIKEOFF_OBJECTIONS_GROUP_ID:strike-off-partner-objections-incoming-consumer}
kafka.topic.strikeoff.processed-objections=${KAFKA_TOPIC_STRIKEOFF_PROCESSED_OBJECTIONS:strike-off-partner-objections-processed}
kafka.strikeoff.processed-objections.group-id=${KAFKA_STRIKEOFF_PROCESSED_OBJECTIONS_GROUP_ID:strike-off-partner-objections-processed-consumer}
kafka.consumer.processed-group-id=${KAFKA_STRIKEOFF_PROCESSED_OBJECTIONS_GROUP_ID:strike-off-partner-objections-processed-consumer}
kafka.session.timeout=${SESSION_TIMEOUT_MS_CONFIG:60000}
kafka.consumer.session-timeout-ms=${SESSION_TIMEOUT_MS_CONFIG:60000}
kafka.max.poll.interval=${MAX_POLL_INTERVAL_MS_CONFIG:350000}
kafka.consumer.max-poll-interval-ms=${MAX_POLL_INTERVAL_MS_CONFIG:350000}
kafka.heartbeat.interval=${HEARTBEAT_INTERVAL_MS_CONFIG:10000}
kafka.consumer.heartbeat-interval-ms=${HEARTBEAT_INTERVAL_MS_CONFIG:10000}
kafka.max.poll.records=${MAX_POLL_RECORDS_CONFIG:1}
kafka.consumer.max-poll-records=${MAX_POLL_RECORDS_CONFIG:1}
kafka.max-attempts=${MAX_ATTEMPTS:5}
kafka.backoff-delay=${BACKOFF_DELAY:1000}
logging.level.org.springframework.kafka.listener=DEBUG
logging.level.org.springframework.kafka.core=DEBUG
logging.level.org.apache.kafka.clients.consumer=DEBUG
logging.level.org.apache.kafka.common.network=INFO
